name: .NET Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        name: Check Out Code
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            6.0.x
            7.0.x
      - name: Restore Dependencies
        run: dotnet restore src
      - name: Build
        run: dotnet build src --configuration Release --no-restore
      - name: Set up Aerospike Database
        uses: reugn/github-action-aerospike@v1.1.0
        with:
          server-version: 6.2.0.7
      - name: Configure Aerospike for Tests
        run: |
          # Enable the Namespace Supervisor (NSUP) to allow TTLs
          docker exec aerospike asinfo -v "set-config:context=namespace;id=test;nsup-period=15"

          # Disable the system memory check to prevent 'Stop Writes' on the GH Runner
          docker exec aerospike asinfo -v "set-config:context=service;stop-writes-sys-memory-pct=100"

          # Optional: Verify the settings
          docker exec aerospike asinfo -v "namespace/test" | grep nsup-period
      - name: Integration Tests
        run: |
          cd ./tests/AeroSharp.IntegrationTests/
          dotnet test --no-restore -nodereuse:false \
            /p:UseSharedCompilation=false \
            /p:UseRazorBuildServer=false \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=/home/runner/work/AeroSharp/AeroSharp/ \
      # - name: Publish Code Coverage
      #   uses: codecov/codecov-action@v3
      #   with:
      #     files: /home/runner/work/AeroSharp/AeroSharp/coverage.net7.0.opencover.xml,/home/runner/work/AeroSharp/AeroSharp/coverage.net6.0.opencover.xml
      #     fail_ci_if_error: true
